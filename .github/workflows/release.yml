# Builds UDriver for Mac, Windows and Linux and publishes a GitHub Release with them and the update files.
# Start it by pushing a tag like v2.0.1, or from the Actions tab with a version.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version, for example 2.0.1
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.version && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  mac:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet tool install -g vpk --version 1.2.161 && echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Load the Developer ID certificate
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          [ -n "$P12" ] || { echo "No MAC_CERT_P12 secret: the app is signed ad hoc and not notarized."; exit 0; }
          KC="$RUNNER_TEMP/sign.keychain-db" KP="$(openssl rand -hex 24)"
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          umask 077
          printf %s "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          # macOS reads only the older .p12 format, so a file exported by OpenSSL 3 is repacked first.
          OSSL="$(brew --prefix openssl@3)/bin/openssl"; [ -x "$OSSL" ] || brew install -q openssl@3
          "$OSSL" pkcs12 -legacy -in "$RUNNER_TEMP/cert.p12" -passin env:P12_PASSWORD -nodes -out "$RUNNER_TEMP/cert.pem"
          "$OSSL" pkcs12 -export -legacy -in "$RUNNER_TEMP/cert.pem" -passout env:P12_PASSWORD -out "$RUNNER_TEMP/cert.p12"
          rm -f "$RUNNER_TEMP/cert.pem"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KP" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | xargs)
          ID="$(security find-identity -v -p codesigning "$KC" | sed -n 's/.*"\(Developer ID Application: .*\)"$/\1/p' | head -1)"
          [ -n "$ID" ] || { echo "The certificate in MAC_CERT_P12 has no Developer ID Application identity."; exit 1; }
          echo "SIGN_APP=$ID" >> "$GITHUB_ENV"
      - run: |
          sh packaging/pack-mac.sh "${TAG#v}"
          cd packaging/releases && mv UDriver-osx-Portable.zip UDriver-mac.zip && rm UDriver-osx-Setup.pkg
      - name: Notarize and check
        if: env.SIGN_APP != ''
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          cd packaging/releases
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          AUTH="--key $RUNNER_TEMP/notary.p8 --key-id $NOTARY_KEY_ID --issuer $NOTARY_ISSUER_ID"
          R="$(xcrun notarytool submit UDriver-mac.zip $AUTH --wait --timeout 1h --output-format json)" || true
          if [ "$(printf %s "$R" | jq -r .status)" != Accepted ]; then
            echo "Apple did not accept the app: $R"
            ID="$(printf %s "$R" | jq -r '.id // empty')"; [ -z "$ID" ] || xcrun notarytool log "$ID" $AUTH
            exit 1
          fi
          rm -rf app && mkdir app && ditto -x -k UDriver-mac.zip app
          xcrun stapler staple app/UDriver.app
          codesign --verify --deep --strict app/UDriver.app
          spctl -a -vv app/UDriver.app
          { printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","clientInfo":{"name":"ci"}}}'; sleep 5; } |
            HOME="$(mktemp -d)" perl -e 'alarm 60; exec @ARGV' app/UDriver.app/Contents/MacOS/server/udriver-mcp | grep -q serverInfo
          rm UDriver-mac.zip && ditto -c -k --sequesterRsrc --keepParent app/UDriver.app UDriver-mac.zip && rm -rf app
      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/sign.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/cert.pem" "$RUNNER_TEMP/notary.p8"
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: packaging/releases/* }

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: dotnet tool install -g vpk --version 1.2.161; "$HOME\.dotnet\tools" >> $env:GITHUB_PATH
      - run: |
          .\packaging\pack-windows.ps1 $env:TAG.TrimStart('v')
          cd packaging\releases; Rename-Item UDriver-win-Setup.exe UDriver-windows-Setup.exe; Remove-Item UDriver-win-Portable.zip
      - uses: actions/upload-artifact@v4
        with: { name: windows, path: packaging/releases/* }

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 10.0.x }
      - run: |
          sudo apt-get update -q && sudo apt-get install -y -q clang-19 && sudo ln -sf /usr/bin/clang-19 /usr/local/bin/clang
          dotnet tool install -g vpk --version 1.2.161 && echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - run: |
          sh packaging/pack-linux.sh "${TAG#v}"
          cd packaging/releases && mv UDriver.AppImage UDriver-linux.AppImage
      - uses: actions/upload-artifact@v4
        with: { name: linux, path: packaging/releases/* }

  publish:
    needs: [mac, windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: gh release create "$TAG" out/* --target "$GITHUB_SHA" --title "UDriver ${TAG#v}" --notes-file packaging/release-notes.md --latest
        env: { GH_TOKEN: '${{ github.token }}' }
